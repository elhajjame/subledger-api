services:
  server:
    build:
      context: .
    environment:
      CONNECT_DB: ${CONNECT_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      JWT_EXPIRED_IN: ${JWT_EXPIRED_IN}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: npm start
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
